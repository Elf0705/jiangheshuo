<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Story Container - 2003</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #c8c8c8;
            --accent-color: #8b0000;
            --dim-color: #444;
            --font-main: "MS Gothic", "SimSun", "Courier New", monospace;
            --red: #FF0000;
        }

        .riddle-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            background: #000;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 10px 26px;
            font-family: var(--font-main);
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #222;
            text-align: center;
            display: none;
        }
        .riddle-btn.visible { display: inline-block; }

        .riddle-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
            box-shadow: 2px 2px 0px var(--accent-color);
        }

        .riddle-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3000;
            background: #fff;
            color: #111;
            padding: 40px 44px 34px;
            border-radius: 14px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7);
            width: 88%;
            max-width: 420px;
            display: none;
            text-align: center;
            font-family: "SimSun", "宋体", serif;
        }
        .riddle-modal.visible {
            display: block;
            animation: riddlePop 0.3s ease;
        }

        .riddle-modal.forced .riddle-close {
            display: none;
        }

        @keyframes riddlePop {
            from { opacity: 0; transform: translate(-50%, -46%) scale(0.94); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .riddle-close {
            position: absolute;
            top: 8px;
            right: 14px;
            font-size: 1.6rem;
            color: #999;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
            font-family: inherit;
        }
        .riddle-close:hover { color: #000; }
        .riddle-question {
            font-size: 1.35rem;
            font-weight: bold;
            color: #000;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }
        .riddle-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: #fafafa;
            color: #111;
            font-family: var(--font-main);
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }
        .riddle-input:focus {
            border-color: #888;
            background: #fff;
        }
        .riddle-input::placeholder { color: #bbb; }
        .riddle-confirm {
            margin-top: 20px;
            background: #111;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            letter-spacing: 2px;
            width: 100%;
            transition: background 0.2s;
        }
        .riddle-confirm:hover { background: #333; }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            image-rendering: pixelated;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(10, 10, 10, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.7;
        }

        .noise-overlay {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.3'/%3E%3C/svg%3E");
            opacity: 0.12;
            pointer-events: none;
            z-index: 998;
            animation: noise-anim 0.2s infinite steps(3);
        }

        @keyframes noise-anim {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-10px, 10px);
            }

            50% {
                transform: translate(10px, -10px);
            }

            75% {
                transform: translate(-10px, -10px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            box-sizing: border-box;
        }

        .page.active {
            display: flex;
        }

        .title-text {
            font-size: 3rem;
            letter-spacing: 0.2rem;
            margin-bottom: 4rem;
            color: var(--text-color);
            text-shadow: 3px 0 var(--accent-color), -2px 0 #0000ff;
            font-weight: bold;
            transform: scaleY(1.2);
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 220px;
        }

        .btn {
            background: #000;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: 0s;
            text-decoration: none;
            font-size: 1.1rem;
            font-family: var(--font-main);
            box-shadow: 4px 4px 0px #222;
            position: relative;
        }

        .btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
            box-shadow: 2px 2px 0px var(--accent-color);
            transform: translate(2px, 2px);
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        #play-screen {
            justify-content: flex-start;
            overflow: hidden;
            padding: 0;
        }

        #top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            box-sizing: border-box;
            background: rgba(5, 5, 5, 0.9);
            z-index: 10;
            border-bottom: 1px solid #222;
            font-size: 0.8rem;
            color: #666;
            flex-shrink: 0;
        }

        #game-scroll-area {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 20px 40px 120px 40px;
            box-sizing: border-box;
            scrollbar-width: none;
        }

        #game-scroll-area::-webkit-scrollbar {
            display: none;
        }

        .text-line {
            margin-bottom: 1.2rem;
            line-height: 1.6;
            animation: fadeIn 0.1s steps(3) forwards;
            font-size: 1.1rem;
            border-left: 3px solid transparent;
            padding-left: 10px;
        }

        .text-line:hover {
            border-left-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.02);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            max-height: 80%;
            background: #000;
            border: 2px solid var(--text-color);
            z-index: 2000;
            padding: 0 20px 20px 20px;
            display: none;
            overflow-y: auto;
            box-shadow: 8px 8px 0px rgba(30, 30, 30, 0.8);
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #000;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 20px 0 10px 0;
            border-bottom: 2px dashed #333;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .slot {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
        }

        .slot:hover {
            border-color: var(--text-color);
            background: #111;
        }

        #choice-container {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .text-psychological {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-bottom: 1px dotted #444;
        }

        .text-violence {
            color: #c04040;
            text-shadow: 2px 0px 0px #000;
            font-weight: bold;
            font-family: "SimHei", sans-serif;
            letter-spacing: 2px;
            transform: skewX(-10deg);
            display: inline-block;
        }

        .text-warm {
            color: #ffdb99;
            text-shadow: 0 0 2px rgba(255, 219, 153, 0.3);
        }

        .text-red {
            color: #c04040;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
        }

        .input-label {
            color: var(--text-color);
            font-size: 1rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
        }

        .pixel-input {
            background: #000;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 10px;
            font-family: var(--font-main);
            font-size: 1.2rem;
            outline: none;
            width: 200px;
            text-align: center;
            box-shadow: inset 3px 3px 0px #222;
        }

        .pixel-input:focus {
            border-color: var(--accent-color);
            box-shadow: inset 3px 3px 0px #300, 0 0 5px var(--accent-color);
        }

        .pixel-input::placeholder {
            color: #444;
        }

        #violence-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: difference;
            background:
                    repeating-linear-gradient(
                            0deg,
                            rgba(255, 0, 0, 0.35) 0px,
                            rgba(255, 0, 0, 0.35) 2px,
                            transparent 2px,
                            transparent 5px
                    ),
                    repeating-linear-gradient(
                            90deg,
                            rgba(0, 0, 0, 0.25) 0px,
                            rgba(0, 0, 0, 0.25) 3px,
                            transparent 3px,
                            transparent 7px
                    );
        }
        #violence-overlay.active {
            animation: violence-glitch 1.6s steps(2) 1;
        }
        @keyframes violence-glitch {
            0%   { opacity: 0;    transform: translate(0, 0);       filter: invert(0) blur(0)   hue-rotate(0deg); }
            5%   { opacity: 1;    transform: translate(-10px, 6px); filter: invert(1) blur(3px) hue-rotate(20deg); }
            10%  { opacity: 0.4;  transform: translate(8px, -5px);  filter: invert(0) blur(6px) hue-rotate(0deg); }
            15%  { opacity: 1;    transform: translate(-12px, -8px);filter: invert(1) blur(4px) hue-rotate(-30deg); }
            20%  { opacity: 0.6;  transform: translate(10px, 9px);  filter: invert(0) blur(8px) hue-rotate(0deg); }
            25%  { opacity: 1;    transform: translate(-8px, 4px);  filter: invert(1) blur(5px) hue-rotate(40deg); }
            30%  { opacity: 0.5;  transform: translate(9px, -7px);  filter: invert(0) blur(7px) hue-rotate(0deg); }
            35%  { opacity: 1;    transform: translate(-11px, 8px); filter: invert(1) blur(3px) hue-rotate(-20deg); }
            40%  { opacity: 0.7;  transform: translate(7px, 6px);   filter: invert(0) blur(9px) hue-rotate(0deg); }
            45%  { opacity: 1;    transform: translate(-9px, -6px); filter: invert(1) blur(4px) hue-rotate(30deg); }
            50%  { opacity: 0.4;  transform: translate(11px, 9px);  filter: invert(0) blur(8px) hue-rotate(0deg); }
            55%  { opacity: 1;    transform: translate(-10px, 5px); filter: invert(1) blur(5px) hue-rotate(-40deg); }
            60%  { opacity: 0.6;  transform: translate(8px, -9px);  filter: invert(0) blur(6px) hue-rotate(0deg); }
            65%  { opacity: 1;    transform: translate(-7px, 7px);  filter: invert(1) blur(4px) hue-rotate(20deg); }
            70%  { opacity: 0.5;  transform: translate(10px, -5px); filter: invert(0) blur(8px) hue-rotate(0deg); }
            75%  { opacity: 1;    transform: translate(-9px, 8px);  filter: invert(1) blur(6px) hue-rotate(-30deg); }
            80%  { opacity: 0.7;  transform: translate(6px, 5px);   filter: invert(0) blur(7px) hue-rotate(0deg); }
            85%  { opacity: 1;    transform: translate(-8px, -7px); filter: invert(1) blur(5px) hue-rotate(40deg); }
            90%  { opacity: 0.5;  transform: translate(5px, 8px);   filter: invert(0) blur(9px) hue-rotate(0deg); }
            95%  { opacity: 0.9;  transform: translate(-6px, 4px);  filter: invert(1) blur(4px) hue-rotate(-20deg); }
            100% { opacity: 0;    transform: translate(0, 0);       filter: invert(0) blur(0)   hue-rotate(0deg); }
        }

        .text-ending {
            font-family: "SimSun", "宋体", serif;
            letter-spacing: 2px;
        }

        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9997;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: all;
        }
        .countdown-overlay.visible {
            opacity: 1;
        }
        .countdown-box {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 40px 60px;
            font-family: var(--font-main);
            color: #888;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-align: center;
            box-shadow: 0 0 60px rgba(139, 0, 0, 0.5), inset 0 0 30px rgba(0, 0, 0, 0.8);
            animation: countdownPulse 1s ease-in-out infinite alternate;
        }
        @keyframes countdownPulse {
            from { box-shadow: 0 0 40px rgba(139, 0, 0, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.8); }
            to   { box-shadow: 0 0 80px rgba(255, 0, 0, 0.7), inset 0 0 30px rgba(0, 0, 0, 0.8); }
        }
        .countdown-time {
            color: #c04040;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 0, 0, 0.8);
        }
        .countdown-time.tick {
            animation: countdownTick 0.2s ease;
        }
        @keyframes countdownTick {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.15); color: #ff4040; }
            100% { transform: scale(1); }
        }

        @keyframes screen-shake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-8px); }
            20% { transform: translateX(8px); }
            30% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            50% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
            70% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
            90% { transform: translateX(-2px); }
        }
        .page.screen-shake {
            animation: screen-shake 0.9s cubic-bezier(0.36, 0.07, 0.19, 0.97) 1;
        }

        #blood-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9996;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }
        #blood-overlay.active {
            opacity: 1;
        }

        .blood-splat-svg {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 220vmax;
            height: 220vmax;
            transform: translate3d(-50%, -50%, 0);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .blood-darken {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            background: radial-gradient(circle at center,
            rgba(50, 0, 0, 0.15) 0%,
            rgba(35, 0, 0, 0.4) 70%,
            rgba(20, 0, 0, 0.65) 100%);
            will-change: opacity;
        }
        #blood-overlay.active .blood-darken {
            animation: bloodDarken 4s ease-out forwards;
        }
        @keyframes bloodDarken {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }
        .blink-triangle {
            display: inline-block;
            margin-left: 8px;
            color: #888;
            font-size: 0.75em;
            transform: translateY(2px);
            animation: blink-triangle 0.9s steps(2) infinite;
            user-select: none;
        }
        @keyframes blink-triangle {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0.15; }
        }

        .detail-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3100;
            background: #0a0a0a;
            color: #c8c8c8;
            border: 1px solid #8b0000;
            border-radius: 10px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85), 0 0 40px rgba(139, 0, 0, 0.4);
            padding: 30px 36px 28px;
            width: 88%;
            max-width: 480px;
            display: none;
            font-family: "SimSun", "宋体", serif;
            letter-spacing: 1px;
            line-height: 1.9;
        }
        .detail-modal.visible {
            display: block;
            animation: riddlePop 0.3s ease;
        }
        .detail-close {
            position: absolute;
            top: 8px;
            right: 14px;
            font-size: 1.5rem;
            color: #666;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
            font-family: inherit;
        }
        .detail-close:hover { color: #c04040; }
        .detail-title {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #333;
            letter-spacing: 3px;
        }
        .detail-body p {
            margin: 10px 0;
            font-size: 0.98rem;
        }
        .detail-label {
            color: #8b0000;
            font-weight: bold;
            margin-right: 4px;
        }
        .detail-value { color: #c8c8c8; }
    </style>
</head>

<button id="riddle-btn" class="riddle-btn" onclick="openRiddle()">点击展开</button>

<div id="riddle-modal" class="riddle-modal">
    <button class="riddle-close" onclick="closeRiddle()">×</button>
    <div class="riddle-question">谁杀死了小红帽？</div>
    <input type="text" id="riddle-input" class="riddle-input" placeholder="在此输入答案" autocomplete="off">
    <button class="riddle-confirm" onclick="confirmRiddle()">确认答案</button>
</div>

<div id="detail-modal" class="detail-modal">
    <button class="detail-close" onclick="closeDetail()">×</button>
    <div class="detail-title">永不落空的猎枪</div>
    <div class="detail-body">
        <p><span class="detail-label">武器：</span>永不落空的猎枪</p>
        <p><span class="detail-label">评级：</span><span class="detail-value">S</span></p>
        <p><span class="detail-label">介绍：</span><span class="detail-value">《谁杀死了小红帽》副本完美通关必定掉落物。猎枪弹巢内仅有一发子弹，仅可锁定一位目标进行瞄准。</span></p>
        <p><span class="detail-label">效果：</span><span class="detail-value">子弹命中后，对目标人物执行即死判定。若判定成功，则强制抹杀命中目标；若判定失败，则将目标强制驱离当前副本，驱逐状态于副本结束时解除。</span></p>
    </div>
</div>

<body onclick="handleGlobalClick(event)">

<audio id="bgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

    <div class="crt-overlay"></div>
    <div class="noise-overlay"></div>

    <div id="home-page" class="page active">
        <div class="title-text" id="game-title">Loading...</div>
        <div class="menu-options">
            <button class="btn" onclick="goToNameInput()">开始游戏</button>
            <button class="btn" onclick="openModal('save-modal')">读取进度</button>
            <button class="btn" onclick="openModal('ending-modal')">结局列表</button>
        </div>
    </div>

    <div id="name-input-screen" class="page">
        <div class="title-text" style="font-size: 2rem; margin-bottom: 3rem;">请输入你的代号</div>
        <div class="input-group">
            <span class="input-label" >请小心，神明不在此地，神明无处不在</span>
            <input type="text" id="input-xing" class="pixel-input" placeholder="无名氏" maxlength="4">
        </div>
        <div class="menu-options" style="margin-top: 2rem;">
            <button class="btn" onclick="confirmName()">确认身份</button>
            <button class="btn" onclick="backToHome()">返回</button>
        </div>
    </div>

    <div id="play-screen" class="page">
        <div id="top-nav">
            <span onclick="goToHome()" style="cursor:pointer;">[ 返回主页 ]</span>
            <span onclick="openModal('jump-modal')" style="cursor:pointer;">[ 跳转选项 ]</span>
            <span onclick="openModal('save-modal')" style="cursor:pointer;">[ 存档/读档 ]</span>
        </div>
        <div id="game-scroll-area">
            <div id="text-container" style="width:100%;"></div>
            <div id="choice-container"></div>
        </div>

                if (flowerFaulseReloads >= 5) return "start_flowers_faulse_5";
                if (flowerFaulseReloads >= 3) return "start_flowers_faulse_3";

                flowersFromCompanion = true;
            }

            if (target === "start_approve" && hasCorpse()) {
                return "start_approve_corpse";
            }

                if (flowersFromCompanion) {
                    flowersFromCompanion = false;
                    return "start4";
                } else {
                    return "start4_好大的胆子竟然不跟小红帽同行，害得我多写几行代码你罪该万死";

            if (bgmStarted) return;
            bgmStarted = true;
            bgm.volume = 0.5;
            bgm.play().catch(() => { bgmStarted = false; });
        }

        function handleGlobalClick(e) {
            if (isCountingDown) return;
            if (isBlackScreen) {
                closeBlackScreen();
                return;
            }
            if (numberGameState.active || numberGameState.ending) return;
            if (waitingForDetail) return;
            if (isBloodEffect) {
                endBloodEffect();
                return;
            }
            if (e.target.closest('#top-nav')) return;
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('.btn') || e.target.closest('.modal')) {
                return;
            }
            if (document.querySelector('.modal[style*="block"]')) return;
            if (riddleForced) return;
            if (document.getElementById('play-screen').classList.contains('active')) {
                handleNext();
            }
        }

        function handleNext() {
            if (riddleForced) return;
            if (isBlackScreen) return;
            if (isCountingDown) return;
            if (waitingForRiddle) return;
            if (isProcessing) return;
            if (numberGameState.active) return;
            if (waitingForDetail) return;
            const scene = storyData[gameState.currentScene];
            if (!scene || isTyping || isChoiceWaiting) return;
            isProcessing = true;

            if (gameState.lineIndex >= scene.lines.length) {
                if (scene.choices) {
                    renderChoices(scene.choices);
                    isProcessing = false;
                } else if (scene.isEnding) {
                    recordEnding(scene.endingId, scene.endingName);
                    isProcessing = false;
                } else if (scene.numberGame) {
                    isProcessing = false;
                    startNumberGame();
                    return;
                } else if (scene.finalQuestion) {
                    isProcessing = false;
                    startFinalQuestion();
                    return;
                } else if (scene.dynamicNext) {
                    const targetScene = scene.dynamicNext();
                    gameState.currentScene = targetScene;
                    gameState.lineIndex = 0;
                    const t = storyData[targetScene];
                    if (!(t && t.noDivider)) renderDivider();
                    isProcessing = false;
                    handleNext();
                } else if (scene.next) {
                    let nextScene = scene.next;
                    if (nextScene === "start_next_friend") {
                        friendState.currentFriend++;
                        friendState.wrongChoices = [];
                        nextScene = "start_friend_" + friendState.currentFriend;
                        if (!storyData[nextScene]) nextScene = "start_success";
                    }
                    nextScene = resolveScene(nextScene);
                    gameState.currentScene = nextScene;
                    gameState.lineIndex = 0;
                    const targetScene = storyData[nextScene];
                    if (!(targetScene && targetScene.noDivider)) {
                        renderDivider();
                    }
                    isProcessing = false;
                    handleNext();
                }
                return;
            }

            const currentLine = scene.lines[gameState.lineIndex];

            if (typeof currentLine === 'object') {
                if (currentLine.requireAxe && !hasAxe()) {
                    gameState.lineIndex++;
                    isProcessing = false;
                    handleNext();
                    return;
                }
                if (currentLine.requireNoAxe && hasAxe()) {
                    gameState.lineIndex++;
                    isProcessing = false;
                    handleNext();
                    return;
                }
                if (currentLine.requireGun && !hasGun()) {
                    gameState.lineIndex++;
                    isProcessing = false;
                    handleNext();
                    return;
                }
                if (currentLine.requireNoGun && hasGun()) {
                    gameState.lineIndex++;
                    isProcessing = false;
                    handleNext();
                    return;
                }
                if (currentLine.item && !gameState.items.includes(currentLine.item)) {
                    gameState.items.push(currentLine.item);
                }
            }

            let text = "";
            let effect = null;
            let isTypingLine = false;

            if (typeof currentLine === 'string') {
                text = currentLine;
            } else {
                if (currentLine.ifGun && hasGun()) {
                    text = currentLine.ifGun;
                } else if (currentLine.ifAxe && hasAxe()) {
                    text = currentLine.ifAxe;
                } else {
                    text = currentLine.text;
                }
                effect = currentLine.effect;
                if (currentLine.type === 'typing') isTypingLine = true;
            }

            text = replaceParams(text);

            if (isTypingLine) {
                renderTyping(text, effect);
            } else {
                renderLine(text, effect);
            }

            if (effect === 'violence') {
                triggerViolenceGlitch();
            }

            if (effect === 'blood') {
                triggerBloodEffect();
            }

            if (effect === 'shake' || (typeof currentLine === 'object' && currentLine.screenShake)) {
                triggerScreenShake();
            }

            if (typeof currentLine === 'object' && currentLine.showRiddle) {
                showRiddleButton();
                waitingForRiddle = true;
            }

            if (typeof currentLine === 'object' && currentLine.blackScreen) {
                showBlackScreen(text, () => {
                    setTimeout(() => handleNext(), 100);
                });
            }

            if (typeof currentLine === 'object' && currentLine.countdown) {
                const cdFormat = currentLine.countdownFormat || "long";
                if (isTyping) {
                    pendingCountdown = true;
                    pendingCountdownFormat = cdFormat;
                } else {
                    setTimeout(() => {
                        if (!isCountingDown) {
                            showCountdown(() => {
                                setTimeout(() => handleNext(), 100);
                            }, cdFormat);
                        }
                    }, 600);
                }
            }

            gameState.lineIndex++;

            if (!isTyping) {
                isProcessing = false;
            }
        }

        let isTyping = false;
        let isChoiceWaiting = false;
        let isProcessing = false;

        function renderLine(text, effect) {
            const div = document.createElement('div');
            div.className = 'text-line';
            if (effect === 'violence' || effect === 'blood') div.classList.add('text-violence');
            if (effect === 'warm') div.classList.add('text-warm');
            const scene = storyData[gameState.currentScene];
            if (scene && scene.isEnding) div.classList.add('text-ending');
            if (effect === 'red') div.classList.add('text-red');
            if (typeof text === 'string' && /<[a-z][\s\S]*>/i.test(text)) {
                div.innerHTML = text;
            } else {
                div.innerText = text;
            }
            document.getElementById('text-container').appendChild(div);
            autoScroll();
        }

        function renderTyping(text, effect) {
            isTyping = true;
            const div = document.createElement('div');
            div.className = 'text-line text-psychological';
            if (effect === 'violence' || effect === 'blood') div.classList.add('text-violence');
            if (effect === 'warm') div.classList.add('text-warm');
            if (effect === 'red') div.classList.add('text-red');
            const scene = storyData[gameState.currentScene];
            if (scene && scene.isEnding) div.classList.add('text-ending');
            document.getElementById('text-container').appendChild(div);

            const currentLine = scene.lines[gameState.lineIndex];
            const glitch = (typeof currentLine === 'object' && currentLine.glitchTrigger) ? currentLine : null;
            let triggerEnd = -1;
            if (glitch) {
                const idx = text.indexOf(glitch.glitchTrigger);
                if (idx >= 0) triggerEnd = idx + glitch.glitchTrigger.length;
            }

            const finishTyping = () => {
                isTyping = false;
                isProcessing = false;

                if (currentLine && currentLine.clickable) {
                    const tri = document.createElement('span');
                    tri.className = 'blink-triangle';
                    tri.innerText = '▼';
                    div.appendChild(tri);

                    div.style.cursor = 'pointer';
                    div.title = '点击查看详情';
                    div.onclick = (e) => {
                        e.stopPropagation();
                        openDetail();
                    };

                    waitingForDetail = true;
                }

                if (pendingCountdown) {
                    pendingCountdown = false;
                    const fmt = pendingCountdownFormat || "long";
                    pendingCountdownFormat = "long";
                    setTimeout(() => {
                        showCountdown(() => {
                            setTimeout(() => handleNext(), 100);
                        }, fmt);
                    }, 400);
                }
            };

            let i = 0;
            const timer = setInterval(() => {
                if (triggerEnd > 0 && i === triggerEnd) {
                    clearInterval(timer);
                    playGlitch(div, glitch, finishTyping);
                    return;
                }
                if (i >= text.length) {
                    clearInterval(timer);
                    finishTyping();
                    return;
                }
                div.innerText += text[i++];
                autoScroll();
            }, config.typingSpeed);
        }

        function playGlitch(div, glitch, callback) {
            const baseText = div.innerText;
            const garble = glitch.glitchGarble || "%$#^>L%)(*&^%@$#@";

            triggerViolenceGlitch();

            let j = 0;
            const garbleTimer = setInterval(() => {
                div.innerText = baseText + garble.slice(0, ++j);
                autoScroll();
                if (j >= garble.length) {
                    clearInterval(garbleTimer);
                    setTimeout(() => {
                        div.innerText = glitch.glitchFinal || baseText;
                        div.classList.remove('text-red', 'text-violence', 'text-warm');
                        const finalEffect = glitch.glitchFinalEffect;
                        if (finalEffect === 'warm') div.classList.add('text-warm');
                        else if (finalEffect === 'violence') div.classList.add('text-violence');
                        else if (finalEffect === 'red') div.classList.add('text-red');
                        autoScroll();
                        if (callback) callback();
                    }, 900);
                }
            }, 45);
        }

        function replaceParams(text) {
            if (!text) return "";
            const cfg = FRIEND_CONFIG[friendState.currentFriend];
            return text.replace(/{xing}/g, gameState.playerInfo.xing)
                .replace(/{ming}/g, gameState.playerInfo.ming)
                .replace(/{friendName}/g, cfg ? cfg.name : "???");
        }

        function renderChoices(choices) {
            isChoiceWaiting = true;
            const container = document.getElementById('choice-container');
            container.innerHTML = '';
            container.style.display = 'flex';

            if (gameState.currentScene === "start_woof") {
                if (flowerState.axeAtStart === null || hasAxe() !== flowerState.axeAtStart) {
                    flowerState.count = 0;
                    flowerState.axeAtStart = hasAxe();
                }
            }

            const filtered = choices.filter(c => {
                if (c.friendChoice && friendState.wrongChoices.includes(c.text)) return false;
                if (c.requireAxe && !hasAxe()) return false;
                if (c.requireNoAxe && hasAxe()) return false;
                if (c.requireGun && !hasGun()) return false;
                if (c.requireNoGun && hasGun()) return false;
                if (c.requireAxeOrGun && !hasAxe() && !hasGun()) return false;
                return true;
            });

            if (filtered.length === 0) {
                const scene = storyData[gameState.currentScene];
                if (scene && scene.next) {
                    isChoiceWaiting = false;
                    container.style.display = 'none';
                    gameState.currentScene = scene.next;
                    gameState.lineIndex = 0;
                    renderDivider();
                    handleNext();

                return;

            filtered.forEach(choice => {
                let rawText = choice.text;
                if (choice.ifAxe && hasAxe()) rawText = choice.ifAxe;
                const displayText = replaceParams(rawText);
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerText = displayText;

                if (choice.hover && (!choice.hoverCondition || choice.hoverCondition())) {
                    const origText = displayText;
                    b.addEventListener('mouseenter', () => { b.innerText = choice.hover; });
                    b.addEventListener('mouseleave', () => { b.innerText = origText; });
                    b.addEventListener('touchstart', () => {
                        clearTimeout(_longPressTimer);
                        _longPressTimer = setTimeout(() => { b.innerText = choice.hover; }, 450);
                    }, { passive: true });
                    b.addEventListener('touchend', () => {
                        clearTimeout(_longPressTimer);
                        b.innerText = origText;
                    });
                    b.addEventListener('touchcancel', () => {
                        clearTimeout(_longPressTimer);
                        b.innerText = origText;

                b.onclick = (e) => {
                    e.stopPropagation();
                    clearTimeout(window._choiceTimeout);

                    container.innerHTML = '';
                    container.style.display = 'none';
                    isChoiceWaiting = false;

                    renderChoiceHistory(displayText, choice.effect);

                    if (choice.friendChoice) {
                        handleFriendChoice(choice.text);
                        return;
                    }

                    if (choice.flowerChoice) {
                        flowerState.count++;
                        const threshold = hasAxe() ? 2 : 5;
                        if (flowerState.count >= threshold && !gameState.items.includes("猎枪")) {
                            gameState.items.push("猎枪");

                    }

                    if (choice.forceRiddle) {
                        document.getElementById('riddle-btn').classList.remove('visible');
                        openRiddle(true);
                        const inp = document.getElementById('riddle-input');

                            inp.readOnly = false;
                            inp.placeholder = '在此输入答案';

                        return;
                    }

                    let finalTarget = choice.target;
                    if (choice.escalateTarget && choice.escalateKey) {
                        if (localStorage.getItem(choice.escalateKey) === '1') {
                            finalTarget = choice.escalateTarget;
                        } else {
                            localStorage.setItem(choice.escalateKey, '1');
                        }
                    }
                    finalTarget = resolveScene(finalTarget);

                    const jump = () => {
                        gameState.currentScene = finalTarget;
                        gameState.lineIndex = 0;
                        const t = storyData[finalTarget];
                        if (!(t && t.noDivider)) renderDivider();
                        handleNext();
                    };

                    if (choice.delay) {
                        setTimeout(jump, choice.delay);
                    } else {
                        jump();
                    }
                };

                if (choice.timeout) {
                    clearTimeout(window._choiceTimeout);
                    window._choiceTimeout = setTimeout(() => {
                        container.innerHTML = '';
                        container.style.display = 'none';
                        isChoiceWaiting = false;
                        const fallback = choice.timeoutTarget || 'start_motty';
                        gameState.currentScene = fallback;
                        gameState.lineIndex = 0;
                        const t = storyData[fallback];
                        if (!(t && t.noDivider)) renderDivider();
                        handleNext();
                    }, choice.timeout);
                }

                container.appendChild(b);
            });
        }

        function submitNumberGuess() {
            if (!numberGameState.active) return;
            const input = document.getElementById('number-game-input');
            const error = document.getElementById('number-game-error');
            const val = parseInt(input.value.trim(), 10);
            const low = numberGameState.low;
            const high = numberGameState.high;
            const bomb = numberGameState.bomb;

            if (isNaN(val) || val < low || val > high) {
                return;
            }

            document.getElementById('number-game-modal').classList.remove('visible');

            renderLine('你：“' + val + '”');
            numberGameState.lastPlayerNum = val;

            if (val === bomb) {
                document.getElementById('number-game-modal').classList.remove('visible');
                numberGameState.active = false;
                numberGameState.ending = false;
                numberGameState.ending = true;
                setTimeout(function () {
                    jumpToSceneByRiddle('start_lose');
                }, 1500);
                return;
            }

            if (val < bomb) {
                numberGameState.low = val + 1;
            } else {
                numberGameState.high = val - 1;
            }

            if (val < bomb) {
                numberGameState.displayLow = val;
            } else {
                numberGameState.displayHigh = val;
            }

            setTimeout(function () {
                const w = pickWolfNumber();
                renderLine('狼外婆：“' + w + '”');
                numberGameState.lastWolfNum = w;

                if (w < bomb) {
                    numberGameState.low = w + 1;
                    numberGameState.displayLow = Math.max(numberGameState.displayLow, w);
                } else if (w > bomb) {
                    numberGameState.high = w - 1;
                    numberGameState.displayHigh = Math.min(numberGameState.displayHigh, w);
                }

                if (w === bomb) {
                    document.getElementById('number-game-modal').classList.remove('visible');
                    numberGameState.active = false;
                    numberGameState.ending = true;
                    setTimeout(function () {
                        jumpToSceneByRiddle('start_win');
                    }, 1500);
                    return;
                }

                if (numberGameState.low === bomb && numberGameState.high === bomb) {
                    setTimeout(function () {
                        renderLine('狼外婆：“' + bomb + '”');
                        numberGameState.lastWolfNum = bomb;
                        document.getElementById('number-game-modal').classList.remove('visible');
                        numberGameState.active = false;
                        numberGameState.ending = true;
                        setTimeout(function () {
                            jumpToSceneByRiddle('start_win');
                        }, 1500);
                    }, 600);
                    return;
                }

                setTimeout(function () {
                    showNumberModal();
                }, 900);
            }, 1000);
        }

        function pickWolfNumber() {
            const low = numberGameState.low;
            const high = numberGameState.high;
            const bomb = numberGameState.bomb;

            if (low === bomb && high === bomb) return bomb;

            const candidates = [];
            if (bomb - 1 >= low && bomb - 1 !== bomb) candidates.push(bomb - 1);
            if (bomb + 1 <= high && bomb + 1 !== bomb) candidates.push(bomb + 1);

            if (candidates.length > 0) {
                return candidates[Math.floor(Math.random() * candidates.length)];
            }
            if (low < bomb) return low;
            if (high > bomb) return high;
            return bomb;
        }

        function stripQuotes(s) {
            return s.trim().replace(/^["“”'']+|["“”'']+$/g, '').trim();
        }

        function confirmRiddle() {
            const rawAnswer = document.getElementById('riddle-input').value;
            const answer = stripQuotes(rawAnswer);

            riddleForced = false;
            waitingForRiddle = false;
            const modal = document.getElementById('riddle-modal');
            modal.classList.remove('visible');
            modal.classList.remove('forced');
            document.getElementById('riddle-btn').classList.remove('visible');

            if (finalQuestionState.active && !finalQuestionState.submitted) {
                finalQuestionState.submitted = true;
                finalQuestionState.active = false;

                let target;
                if (answer === "") {
                    target = finalQuestionState.mindless ? "living" : "ending_living";
                } else {
                    const playerName = gameState.playerInfo.xing;
                    if (answer === playerName) target = "yourself";
                    else if (answer === "狼" || answer === "猎人") target = "family";
                    else if (["系统", "阿比斯", "Abyss", "系统自己", "系统自身", "副本", "副本本身"].includes(answer)) target = "Abyss";
                    else if (answer === "小红帽") target = "Red";
                    else if (answer === "外婆" || answer === "狼外婆") target = "grandma";
                    else target = "ending_mindless";
                }
                jumpToSceneByRiddle(target);
                return;
            }

            if (pendingRiddle) {
                const choice = pendingRiddle;
                pendingRiddle = null;
                let key = choice.riddleKey;
                if (key === "{xing}") key = gameState.playerInfo.xing;
                const target = (answer === key)
                    ? choice.riddleThen.yes
                    : choice.riddleThen.no;
                gameState.currentScene = target;
                gameState.lineIndex = 0;
                renderDivider();
                handleNext();
                return;
            }

            const playerName = gameState.playerInfo.xing;
            let target = "ending_mindless";

            if (answer === "狼" || answer === "猎人") {
                target = "family";
            } else if (answer === playerName) {
                target = "yourself";
            } else if (["系统", "阿比斯", "Abyss", "系统自己", "系统自身", "副本", "副本本身"].includes(answer)) {
                target = "Abyss";
            } else if (answer === "") {
                target = "living";
            } else if (answer === "小红帽") {
                target = "Red";
            } else if (answer === "外婆" || answer === "狼外婆") {
                target = "grandma";
            }

            jumpToSceneByRiddle(target);
        }

        function jumpToSceneByRiddle(sceneId) {
            numberGameState.ending = false;
            finalQuestionState.active = false;
            finalQuestionState.submitted = false;
            finalQuestionState.mindless = false;
            hideTopRightCountdown();
            gameState.currentScene = sceneId;
            gameState.lineIndex = 0;
            isChoiceWaiting = false;
            document.getElementById('choice-container').innerHTML = '';
            renderDivider();
            handleNext();
        }

        function autoScroll() {
            const el = document.getElementById('game-scroll-area');
            if (el) el.scrollTop = el.scrollHeight;
        }

        function saveGame(slotId) {
            const data = {
                currentScene: gameState.currentScene,
                lineIndex: gameState.lineIndex,
                historyHTML: document.getElementById('text-container').innerHTML,
                time: new Date().toLocaleString(),
                playerInfo: gameState.playerInfo,
                items: gameState.items,
                friendState: friendState
            };
            localStorage.setItem(`save_slot_${slotId}`, JSON.stringify(data));
            openModal('save-modal');
        }

        function loadGame(slotId) {
            const data = JSON.parse(localStorage.getItem(`save_slot_${slotId}`));
            if (!data) return;
            gameState.currentScene = data.currentScene;
            gameState.lineIndex = data.lineIndex;

            let loadedInfo = data.playerInfo || {};
            if (loadedInfo.lastName && !loadedInfo.xing) loadedInfo.xing = loadedInfo.lastName;
            if (loadedInfo.firstName && !loadedInfo.ming) loadedInfo.ming = loadedInfo.firstName;

            if (!loadedInfo.xing) loadedInfo.xing = "无名氏";

            gameState.playerInfo = loadedInfo;
            gameState.items = data.items || [];
            if (!gameState.items.includes("斧头")) {
                flowerFaulseReloads++;
                localStorage.setItem('flower_faulse_reloads', flowerFaulseReloads);
            }
            isCountingDown = false;
            pendingCountdown = false;
            isChoiceWaiting = false;
            window._endingShown = false;
            const existingCd = document.getElementById('countdown-overlay');
            if (existingCd) existingCd.remove();
            const choiceBox = document.getElementById('choice-container');
            choiceBox.innerHTML = '';
            choiceBox.style.display = 'none';

            if (data.friendState) {
                friendState.currentFriend = data.friendState.currentFriend || 1;
                friendState.correctCount = data.friendState.correctCount || 0;
                friendState.totalAttempts = data.friendState.totalAttempts || 0;
                friendState.wrongChoices = data.friendState.wrongChoices || [];
            }

            document.getElementById('text-container').innerHTML = data.historyHTML + "<div style='color:red; font-size:0.7rem'>[ 进度已读取 ]</div>";

            document.getElementById('home-page').classList.remove('active');
            document.getElementById('name-input-screen').classList.remove('active');
            document.getElementById('play-screen').classList.add('active');

            closeModal('save-modal');
            autoScroll();

            const scene = storyData[gameState.currentScene];

            if (scene && scene.isEnding && gameState.lineIndex >= scene.lines.length) {
                window._endingShown = true;
                const b = document.createElement('button');
                b.className = 'btn';
                b.style.marginTop = "20px";
                b.innerText = "回到主页";
                b.onclick = () => location.reload();
                document.getElementById('text-container').appendChild(b);
            }
            showLoadMessage("赞美主神的仁慈吧，祂们赐予了你重来一次的机会");
            startBGM();
        }

        function showLoadMessage(text, callback) {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9998;
                background: rgba(0,0,0,0.6);
                backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                opacity: 0;
                transition: opacity 0.6s ease;
                padding: 20px;
            `;
            document.body.appendChild(overlay);

            const t = document.createElement('div');
            t.innerText = text;
            t.style.cssText = `
                color: #c8c8c8;
                font-family: var(--font-main);
                font-size: 1.2rem;
                letter-spacing: 3px;
                text-align: center;
                max-width: 600px;
                line-height: 1.8;
                opacity: 0;
                transition: opacity 0.9s ease 0.3s;
            `;
            overlay.appendChild(t);

            requestAnimationFrame(() => {
                overlay.style.opacity = '1';
                t.style.opacity = '1';
            });

            overlay.addEventListener('click', (e) => {
                e.stopPropagation();
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.remove();
                    if (callback) callback();
                }, 600);
            });
        }

        function recordEnding(id, name) {
            if (window._endingShown) return;
            window._endingShown = true;

            const numId = Number(id);
            if (!Number.isInteger(numId)) return;

            if (!gameState.endingsFound.includes(numId)) {
                gameState.endingsFound.push(numId);
                gameState.endingsFound = [...new Set(gameState.endingsFound)].sort((a, b) => a - b);
                localStorage.setItem('endings_found_v2', JSON.stringify(gameState.endingsFound));
            }
            renderLine(`\n【结局：${name}】`);
            const b = document.createElement('button');
            b.className = 'btn';
            b.style.marginTop = "20px";
            b.innerText = "回到主页";
            b.onclick = (ev) => {
                ev.stopPropagation();
                ev.preventDefault();
                goHomeHardReload();
            };
            document.getElementById('text-container').appendChild(b);
        }

        function goHomeHardReload() {
            document.getElementById('text-container').innerHTML = '';
            const cc = document.getElementById('choice-container');
            cc.innerHTML = '';
            cc.style.display = 'flex';

            gameState.currentScene = "start1";
            gameState.lineIndex = 0;
            gameState.items = [];
            friendState.currentFriend = 1;
            friendState.correctCount = 0;
            friendState.totalAttempts = 0;
            friendState.wrongChoices = [];

            finalQuestionState.active = false;
            finalQuestionState.submitted = false;
            finalQuestionState.mindless = false;

            isTyping = false;
            isChoiceWaiting = false;
            isProcessing = false;
            waitingForRiddle = false;
            isCountingDown = false;
            pendingCountdown = false;
            riddleForced = false;
            window._endingShown = false;

            ['countdown-overlay', 'black-overlay'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.remove();
            });
            document.getElementById('violence-overlay')?.classList.remove('active');
            document.getElementById('riddle-btn').classList.remove('visible');

            document.getElementById('play-screen').classList.remove('active');
            document.getElementById('name-input-screen').classList.remove('active');
            document.getElementById('home-page').classList.add('active');
        }

        function goToNameInput() {
            document.getElementById('home-page').classList.remove('active');
            document.getElementById('name-input-screen').classList.add('active');
        }

        function backToHome() {
            document.getElementById('name-input-screen').classList.remove('active');
            document.getElementById('home-page').classList.add('active');
        }

        function confirmName() {
            const xingInput = document.getElementById('input-xing').value.trim();

            gameState.playerInfo.xing = xingInput || "无名氏";

            newGame();
        }

        function newGame() {
            document.getElementById('name-input-screen').classList.remove('active');
            document.getElementById('play-screen').classList.add('active');
            window._endingShown = false;
            startBGM();
            flowerState = { count: 0, axeAtStart: null };
            flowerFaulseReloads = 0;
            localStorage.removeItem('flower_faulse_reloads');

            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                color:#c04040;
                text-shadow: 0 0 12px rgba(255, 0, 0, 0.8);
                font-family: var(--font-main);
                font-size: 1.3rem;
                letter-spacing: 3px;
                cursor: pointer;
                opacity: 0;
                transition: opacity 0.9s ease;
                text-align: center;
                padding: 20px;
                user-select: none;
            `;
            overlay.innerText = "欢迎加入阿比斯，迷途的羔羊。";
            document.body.appendChild(overlay);

            requestAnimationFrame(() => overlay.style.opacity = '1');

            overlay.addEventListener('click', (e) => {
                e.stopPropagation();
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.remove();
                    handleNext();
                }, 900);
            });
        }

        function goToHome() {
            if (confirm("确定要返回主页吗？未保存的进度将丢失。")) {
                goHomeHardReload();
            }
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'block';
            if (id === 'save-modal') renderSaveSlots();
            if (id === 'ending-modal') renderEndingList();
            if (id === 'jump-modal') renderJumpList();
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function renderSaveSlots() {
            const container = document.getElementById('save-slots');
            container.innerHTML = '';
            for (let i = 1; i <= 3; i++) {
                const data = JSON.parse(localStorage.getItem(`save_slot_${i}`));
                const div = document.createElement('div');
                div.className = 'slot';
                div.innerHTML = `
            <span>位置 ${i} <br><small>${data ? data.time : '空存档'}</small></span>
            <div>
                <button class="btn" style="padding:5px" onclick="saveGame(${i})">存档</button>
                ${data ? `<button class="btn" style="padding:5px" onclick="loadGame(${i})">读档</button>` : ''}
            </div>
        `;
                container.appendChild(div);
            }
        }

        function renderEndingList() {
            const container = document.getElementById('ending-list');
            container.innerHTML = '';

            for (let i = 1; i <= config.totalEndings; i++) {
                const isFound = gameState.endingsFound.includes(Number(i));
                const div = document.createElement('div');
                div.className = 'slot';

                let endingName = null;
                for (const key in storyData) {
                    const scene = storyData[key];
                    if (scene.isEnding && scene.endingId === i && scene.endingName) {
                        endingName = scene.endingName;
                        break;
                    }
                }

                if (isFound && endingName) {
                    div.innerText = `Ending${i}：“${endingName}”`;
                } else if (isFound) {
                    div.innerText = `Ending ${i}: 已解锁`;
                } else {
                    div.innerText = `Ending ${i}: ？？？`;
                }

                container.appendChild(div);
            }
        }

        function renderJumpList() {
            const container = document.getElementById('jump-list');
            container.innerHTML = '';

            for (const [key, scene] of Object.entries(storyData)) {
                if (scene.choices && scene.choices.length > 0) {
                    const div = document.createElement('div');
                    div.className = 'slot';
                    div.style.flexDirection = 'column';
                    div.style.alignItems = 'flex-start';
                    div.style.gap = '10px';

                    const optionsPreview = scene.choices.map(c => `[${c.text}]`).join(' ');

                    div.innerHTML = `
                <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:bold; color:var(--accent-color)">节点: ${key}</span>
                    <button class="btn" style="padding:5px 10px; font-size:0.8rem;" onclick="jumpToScene('${key}')">跳转</button>
                </div>
                <div style="font-size:0.8rem; color:#666;">
                    包含选项: ${replaceParams(optionsPreview)}
                </div>
            `;
                    container.appendChild(div);
                }
            }

            if (container.children.length === 0) {
                container.innerHTML = '<div style="padding:20px; text-align:center;">暂无可用跳转节点</div>';
            }
        }

        function jumpToScene(sceneId) {
            if (confirm("跳转将覆盖当前进度，确定跳转吗？")) {
                gameState.currentScene = sceneId;
                const scene = storyData[sceneId];
                gameState.lineIndex = scene.lines.length;

                document.getElementById('text-container').innerHTML = "<div style='color:var(--accent-color); font-size:0.8rem; margin: 20px 0;'>[ 已跳转至节点 ]</div>";
                closeModal('jump-modal');

                renderChoices(scene.choices);
                autoScroll();
            }
        }
    </script>
</body>

</html>
